services:
  db:
    image: mysql:8.4
    command: --max-allowed-packet=128M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configura .env}
      MYSQL_USER: ${MYSQL_USER:?Configura .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Configura .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Configura .env}
    volumes:
      - app_data:/app/instance
    depends_on:
      db:
        condition: service_healthy
  db_test:
    profiles: [test]
    image: mysql:8.4
    command: --max-allowed-packet=128M
    environment:
      MYSQL_DATABASE: fdpus_test
      MYSQL_USER: fdpus_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura .env}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u fdpus_test -D fdpus_test -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  tests:
    profiles: [test]
    build: .
    command: ["python", "run_tests.py"]
    environment:
      TEST_MYSQL: "1"
      DB_HOST: db_test
      DB_NAME: fdpus_test
      DB_USER: fdpus_test
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configura .env}
    depends_on:
      db_test:
        condition: service_healthy
volumes:
  mysql_data:
  app_data:
